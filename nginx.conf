# Serves the built static site. Nothing dynamic, no upstream, no state.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    # Astro builds with format: 'directory', so /about → /about/index.html.
    location / {
        try_files $uri $uri/ /404.html;
    }

    # Hashed build assets. Safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hand-made assets that keep their filenames across deploys.
    location ~* ^/(og|hero)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML must not be cached hard, or publishing a new event does not show up.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # This site loads nothing from anywhere except the Luma embed, so the policy can be
    # tight. If you add anything third-party, this is the file that will stop it working —
    # which is the point.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://embed.lu.ma; frame-src https://luma.com https://lu.ma; connect-src 'self' https://api.lu.ma https://luma.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    error_page 404 /404.html;
    location = /404.html { internal; }
}
